version: "3.9"

services:
  # ============================================
  # Neo4j — Graph Database
  # ============================================
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./neo4j/plugins:/plugins
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'RETURN 1;' | cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-password} 2>/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ============================================
  # Qdrant — Vector Database
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # HTTP REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============================================
  # Ollama — Local LLM & Embeddings (optional)
  # ============================================
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama", "full"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull nomic-embed-text 2>/dev/null || true
        wait

  # ============================================
  # Redis — Cache (optional)
  # ============================================
  redis:
    image: redis:7-alpine
    profiles: ["full"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Postgres — Optional metadata store
  # ============================================
  postgres:
    image: postgres:16-alpine
    profiles: ["full"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=yats
      - POSTGRES_PASSWORD=${PG_PASSWORD:-password}
      - POSTGRES_DB=yats
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U yats -d yats"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
  qdrant-storage:
  ollama-models:
  redis-data:
  pgdata:
