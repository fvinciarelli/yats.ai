# Codex MCP stdio bridge config
# Place in .codex/config.toml at repo root or ~/.codex/config.toml

model = "gpt-4.1-mini"
sandbox_mode = "danger-full-access"
approval_policy = "never"

[features]
multi_agent = false              # REQUIRED: force direct MCP tool usage

[mcp_servers.yats]
command = "node"
args = ["path/to/yats-toolkit/benchmark/adapters/mcp-bridge-stdio.cjs", "--stdio"]
# Update the path above to point to your mcp-bridge-stdio.cjs
