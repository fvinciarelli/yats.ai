name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build C# bridge
        run: dotnet build packages/analyzers/analyzer-csharp/src/csharp-bridge/RoslynAnalyzer.csproj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Java bridge (shaded jar)
        working-directory: packages/analyzers/analyzer-java/src/java-bridge
        run: mvn -q -DskipTests package
      - name: Install rust-analyzer
        run: |
          wget -qO /tmp/ra.gz https://github.com/rust-lang/rust-analyzer/releases/latest/download/rust-analyzer-x86_64-unknown-linux-gnu.gz
          gunzip /tmp/ra.gz
          chmod +x /tmp/ra
          sudo mv /tmp/ra /usr/local/bin/rust-analyzer
      - name: Install Python deps (libcst for Python analyzer bridge)
        run: pip install libcst
      - name: Build
        run: pnpm build
      - run: pnpm run test

  docker:
    name: Docker → GHCR
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yats.ai
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke — image bridges
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull image
        run: docker pull ghcr.io/${{ github.repository_owner }}/yats.ai:latest

      # Gate: the C# bridge must run INSIDE the published image. This caught
      # the ICU regression (silent regex fallback, empty call graph) that
      # local tests couldn't see.
      - name: C# bridge
        run: |
          echo 'namespace N; public class Foo { public void Bar() { Helper(); } private void Helper() {} }' \
            | docker run --rm -i --entrypoint /usr/local/lib/yats-csharp-bridge/yats-csharp-bridge ghcr.io/${{ github.repository_owner }}/yats.ai:latest --file Test.cs --repo r --stdin \
            | grep -q '"kind": "CLASS"'

      - name: Go bridge
        run: |
          printf 'package main\ntype S struct{}\nfunc (s *S) F() {}\n' \
            | docker run --rm -i --entrypoint /usr/local/bin/yats-go-bridge ghcr.io/${{ github.repository_owner }}/yats.ai:latest --file t.go --repo r --stdin \
            | grep -q '"kind": "struct"'

  npm:
    name: npm → yats-toolkit
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version
        working-directory: packages/yats-toolkit
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: packages/yats-toolkit
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub Release
    needs: [docker, npm, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # Extract section between this version header and the next one
          sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '$d' > /tmp/release-notes.md
          # If empty (last version in file), just take everything from the header
          if [ ! -s /tmp/release-notes.md ]; then
            sed -n "/^## \[$VERSION\]/,\$p" CHANGELOG.md > /tmp/release-notes.md
          fi
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          make_latest: true
