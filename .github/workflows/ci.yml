name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint → TypeCheck → Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build C# bridge
        run: dotnet build packages/analyzers/analyzer-csharp/src/csharp-bridge/RoslynAnalyzer.csproj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Java bridge (shaded jar)
        working-directory: packages/analyzers/analyzer-java/src/java-bridge
        run: mvn -q -DskipTests package

      - name: Install rust-analyzer
        run: |
          wget -qO /tmp/ra.gz https://github.com/rust-lang/rust-analyzer/releases/latest/download/rust-analyzer-x86_64-unknown-linux-gnu.gz
          gunzip /tmp/ra.gz
          chmod +x /tmp/ra
          sudo mv /tmp/ra /usr/local/bin/rust-analyzer

      - name: Install Python deps (libcst for Python analyzer bridge)
        run: pip install libcst

      - name: Build
        run: pnpm build

      - name: TypeCheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  docker-build:
    name: Docker build (dry-run + bridge smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: yats:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: run each subprocess bridge INSIDE the image. These would
      # have caught the ICU regression (C# bridge crashing on alpine) the day
      # it shipped — local tests run bridges via host tools and can't see it.
      - name: Smoke — C# bridge
        run: |
          echo 'namespace N; public class Foo { public void Bar() { Helper(); } private void Helper() {} }' \
            | docker run --rm -i --entrypoint /usr/local/lib/yats-csharp-bridge/yats-csharp-bridge yats:ci --file Test.cs --repo r --stdin \
            | grep -q '"kind": "CLASS"'

      - name: Smoke — Go bridge
        run: |
          printf 'package main\ntype S struct{}\nfunc (s *S) F() {}\n' \
            | docker run --rm -i --entrypoint /usr/local/bin/yats-go-bridge yats:ci --file t.go --repo r --stdin \
            | grep -q '"kind": "struct"'

      - name: Smoke — rust-analyzer binary
        run: docker run --rm --entrypoint sh yats:ci -c 'rust-analyzer --version' | grep -q 'rust-analyzer'
